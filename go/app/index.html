<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>HangSpine — Opening the App Store…</title>
<!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "9e7d7b5f22f94ac59e86b715b9cada7c"}'></script><!-- End Cloudflare Web Analytics -->
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0a0a;color:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .box{text-align:center;padding:24px}
  .btn{display:inline-block;margin-top:16px;padding:12px 22px;border-radius:10px;background:#0a84ff;color:#fff;text-decoration:none;font-weight:600}
  p{margin:4px 0}
</style>
</head>
<body>
<div class="box">
  <p>Opening the App Store…</p>
  <a id="manual" class="btn" href="https://apps.apple.com/app/id6817156558?ct=web_go_app">Tap here if nothing happens</a>
</div>
<noscript><meta http-equiv="refresh" content="0;url=https://apps.apple.com/app/id6817156558?ct=web_go_app"></noscript>
<script>
(function () {
  var m = (location.search.match(/[?&]ct=([A-Za-z0-9_.-]+)/) || [])[1] || "web_go_app";
  var pt = (location.search.match(/[?&]pt=([A-Za-z0-9_.-]+)/) || [])[1] || "";
  var target = "https://apps.apple.com/app/id6817156558?ct=" + m + (pt ? "&pt=" + pt : "");
  var a = document.getElementById("manual");
  if (a) a.href = target;
  // give the analytics beacon ~0.6s to fire before we leave
  setTimeout(function () { location.replace(target); }, 600);
})();
</script>
</body>
</html>
